name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default for the whole workflow; jobs may not exceed this.
permissions:
  contents: read

# Cancel in-progress runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.7"
          enable-cache: true
      - name: Install dependencies (locked)
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}
      - name: Lint with ruff
        run: uv run ruff check src/ tests/
      - name: Format check with ruff
        run: uv run ruff format --check src/ tests/
      - name: Run tests
        run: uv run python -m pytest tests/ -q --tb=short
      - name: Check imports
        run: uv run python -c "import amplihack_eval; print('Version:', amplihack_eval.__version__)"

  # Fail the build on known vulnerabilities in the locked dependency set.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.7"
          enable-cache: true
      - name: Export locked dependencies
        run: uv export --frozen --all-extras --no-emit-project --format requirements-txt -o audit-requirements.txt
      - name: Audit dependencies (pip-audit)
        run: uvx pip-audit@2.10.1 --requirement audit-requirements.txt --strict

  # Only run integration tests on main with API key available
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.7"
          enable-cache: true
      - name: Install dependencies (locked, all extras)
        run: uv sync --frozen --extra all --extra dev --python 3.12
      - name: Integration tests
        run: uv run python -m pytest tests/ -q -m "not slow"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
